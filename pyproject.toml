[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.11, <1.0"]

[project]
name = "schema-to"
version = "0.0.1"
requires-python = ">=3.14.0,<4.0"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
dependencies = [
  "caseutil>=0.7.2",
  "jinja2>=3.1.6", # Templating for generated FastAPI endpoint bodies
  "niquests>=3.21",
  "orjson>=3.11",
  "py-yaml12>=0.1", # YAML 1.2 library
  "pydantic>=2.13",
  "referencing>=0.37", # JSON Schema $ref / $dynamicRef resolution
  "typer>=0.27",
]

[project.scripts]
schema-to = "schema_to.__main__:cli"

[dependency-groups]
dev = [
  "hypothesis>=6.165",
  "psycopg[binary]>=3.3", # Only to test the generated runtime module; not a runtime dep
  "pytest>=9.1",
  "ruff>=0.16.3",
  "ty>=0.0.71",
]

[tool.ty.src]
# `examples` holds illustrative generated-style code (intentional stubs), not
# library code, so it is checked by its own tooling rather than here.
exclude = ["examples"]

[tool.ruff]
# `examples` holds illustrative generated-style code, not part of the library;
extend-exclude = ["examples"]
src = ["src"] # Needed for import sorting
line-length = 100

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "tab-indentation",
  "docstring-tab-indentation",
  "indentation-with-invalid-multiple-comment",
  "over-indented",
  "line-too-long",
  "doc-line-too-long",
  "missing-trailing-comma",
  "prohibited-trailing-comma",
  "CPY",
  "triple-single-quotes",
  "multi-line-implicit-string-concatenation",
  "D1",
  "non-imperative-mood",
  "undocumented-param",
  "docstring-missing-returns",
  "docstring-missing-yields",
  "docstring-missing-exception",
  "docstring-extraneous-exception",
  "bare-except",
  "line-contains-todo",
  "magic-value-comparison",
  "no-self-use",
  "ambiguous-unicode-character-string",
  "ambiguous-unicode-character-docstring",
  "ambiguous-unicode-character-comment",
  "parenthesize-chained-operators",
  "suspicious-pickle-import",
  "suspicious-subprocess-import",
  "typing-only-first-party-import",
  "typing-only-third-party-import",
  "typing-only-standard-library-import",
  "unaliased-collections-abc-set-import",
  "TD",
  "Q",
]
unfixable = [
  "unquoted-type-alias",
]
extend-safe-fixes = [
  "missing-blank-line-after-summary",
  "f-string-in-exception",
  "unsorted-imports",
  "log-exception-outside-except-handler",
  "import-outside-top-level",
  "literal-membership",
  "pytest-composite-assertion",
  "unsorted-dunder-all",
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
  "replace-str-enum",
]
extend-unsafe-fixes = [
  "subprocess-run-without-check",
  "invalid-rule-code",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
  "D10",
  "import-private-name",
  "assert",
  "hardcoded-password-string",
  "hardcoded-password-func-arg",
  "hardcoded-password-default",
  "hardcoded-temp-file",
  "relative-imports",
]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-builtins]
ignorelist = ["input"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
detect-same-package = false
split-on-trailing-comma = false

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10
max-positional-args = 5
max-bool-expr = 10
max-nested-blocks = 4

[tool.pytest]
pythonpath = ["src/"]
testpaths = ["tests/"]
empty_parameter_set_mark = "fail_at_collect"
log_level = "WARNING"
log_cli = true
log_format = "%(asctime)s %(levelname)-7s %(name)s %(filename)s:%(lineno)s | %(message)s "
log_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
  "slow: tests that need a long time to run",
  "e2e: tests that need external services",
]
addopts = [
  "--import-mode=importlib",
  "--strict",
  "--tb=short",
  "--quiet",
]
