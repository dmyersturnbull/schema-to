[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.11, <1.0"]

[project]
name = "schema-to"
version = "0.0.1"
requires-python = "~=3.14.0"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
dependencies = [
  "caseutil>=0.7.2",
  "niquests>=3.18",
  "orjson>=3.11",
  "py-yaml12>=0.1", # YAML 1.2 library
  "pydantic>=2.13",
  "referencing>=0.37", # JSON Schema $ref / $dynamicRef resolution
  "typer>=0.25", # CLI framework
]

[project.scripts]
schema-to = "schema_to.__main__:cli"

[dependency-groups]
dev = [
  "ruff>=0.15.12",
  "pytest>=9.0",
  "hypothesis>=6.152.7",
]

[tool.ruff]
exclude = [] # Rely on https://docs.astral.sh/ruff/settings/#respect-gitignore
src = ["src"] # Needed for import sorting
line-length = 100

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "W191",     
  "D206",     
  "E114",     
  "E117",     
  "E501",     
  "W505",     
  "COM812",   
  "COM819",   
  "CPY",
  "D300",     
  "ISC002",   
  "D1",       
  "D401",     
  "D417",     
  "DOC201",   
  "DOC402",   
  "DOC501",   
  "DOC502",   
  "E722",     
  "FIX002",   
  "PLR2004",  
  "PLR6301",  
  "RUF001",   
  "RUF002",   
  "RUF003",   
  "RUF021",   
  "S403",     
  "S404",     
  "TD",       
  "Q",        
]
unfixable = [
  "TC007",
]
extend-safe-fixes = [
  "LOG004",
]
extend-unsafe-fixes = [
  "PLW1510",
  "RUF102",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
  "D10",     
  "S101",    
  "S105",    
  "S106",    
  "S107",    
  "S108",    
  "TID252",  
]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
detect-same-package = false
split-on-trailing-comma = false

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 10
max-positional-args = 5
max-bool-expr = 10
max-nested-blocks = 4

[tool.pytest]
pythonpath = ["src/"]
testpaths = ["tests/"]
empty_parameter_set_mark = "fail_at_collect"
log_level = "WARNING"
log_cli = true
log_format = "%(asctime)s %(levelname)-7s %(name)s %(filename)s:%(lineno)s | %(message)s "
log_date_format = "%Y-%m-%d %H:%M:%S"
markers = [
  "slow: tests that need a long time to run",
  "e2e: tests that need external services",
]
addopts = [
  "--import-mode=importlib",
  "--strict",               
  "--tb=short",             
  "--quiet",                
]
