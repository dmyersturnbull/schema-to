name: Test

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  pytest:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Check lock file and install dependencies
        run: uv sync --locked
      - name: Run pytest
        run: uv run pytest -m "not e2e"
