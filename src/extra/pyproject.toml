[build-system]
build-backend = "uv_build"
requires = ["uv-build>=0.11, <1.0"]

[project]
name = "query-dsl"
version = "0.0.1"
description = "Parameterised PostgreSQL queries from REST select/where/sort/limit/offset strings."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "psycopg>=3.2",
]

# This directory is staged inside the schema-to repository so the generated
# FastAPI applications have a runtime to depend on.  It is intended to be split
# out into its own repository and published to PyPI as `query-dsl`; until then
# it is excluded from the schema-to wheel and exercised by schema-to's tests.
[tool.uv.build-backend]
module-name = "query_dsl"
